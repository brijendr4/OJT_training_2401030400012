<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Neumorphic Sign Up</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #e0e8f6;
            --text-color: #3a4255;
            --text-light: #737f9c;
            --error-color: #dc3545;
            --success-color: #198754;
            
            /* Neumorphic Soft Shadow Specs */
            --neu-flat: 12px 12px 24px #bec7d6, -12px -12px 24px #ffffff;
            --neu-inset: inset 6px 6px 12px #c2ccd6, inset -6px -6px 12px #ffffff;
            --neu-btn: 6px 6px 12px #c2ccd6, -6px -6px 12px #ffffff;
            --neu-btn-active: inset 4px 4px 8px #c2ccd6, inset -4px -4px 8px #ffffff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        /* Neumorphic Form Card */
        .login-card {
            background-color: var(--bg-color);
            border-radius: 30px;
            box-shadow: 20px 20px 60px #bec7d6, -20px -20px 60px #ffffff !important;
            border: none;
            position: relative;
            overflow: hidden;
            width: 100%;
            max-width: 420px;
        }

        /* Header Icon */
        .neu-icon {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: var(--neu-flat);
            color: var(--text-color);
        }

        /* Custom Inset Inputs mapped over Bootstrap structural groups */
        .neu-input-wrapper {
            position: relative;
        }

        .neu-input-wrapper input {
            width: 100%;
            padding: 16px 16px 16px 50px !important;
            border: none;
            outline: none;
            background: var(--bg-color);
            border-radius: 16px;
            box-shadow: var(--neu-inset);
            color: var(--text-color);
            transition: all 0.3s ease;
            height: auto;
        }

        .neu-input-wrapper input:focus {
            background: var(--bg-color);
            box-shadow: var(--neu-inset);
            outline: none;
        }

        /* Dynamic Floating Labels */
        .neu-input-wrapper label {
            position: absolute;
            left: 50px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
            transition: all 0.25s ease;
            margin: 0;
            padding: 0;
        }

        .neu-input-wrapper input:focus ~ label,
        .neu-input-wrapper input:not(:placeholder-shown) ~ label {
            transform: translateY(-170%) scale(0.85);
            left: 15px;
            color: var(--text-color);
            font-weight: 600;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            display: flex;
            align-items: center;
            pointer-events: none;
            z-index: 4;
        }

        /* Password Show Toggle */
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-color);
            border: none;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            box-shadow: var(--neu-btn);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-light);
            z-index: 5;
        }

        .password-toggle:active {
            box-shadow: var(--neu-btn-active);
        }

        .password-toggle .eye-closed { display: none; }
        .password-toggle.show-pass .eye-open { display: none; }
        .password-toggle.show-pass .eye-closed { display: block; }

        /* Custom Neumorphic Checkbox */
        .remember-wrapper input[type="checkbox"] {
            display: none;
        }

        .neu-checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            box-shadow: var(--neu-inset);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: transparent;
            transition: color 0.2s ease;
            vertical-align: middle;
        }

        .remember-wrapper input[type="checkbox"]:checked + label .neu-checkbox {
            color: var(--text-color);
        }

        /* Custom Neumorphic Buttons */
        .neu-btn-primary {
            background: var(--bg-color);
            border: none;
            border-radius: 16px;
            box-shadow: var(--neu-btn);
            color: var(--text-color);
            font-weight: 700;
            padding: 16px;
            transition: all 0.2s ease;
        }

        .neu-btn-primary:hover, .neu-btn-primary:focus {
            background: var(--bg-color);
            color: var(--text-color);
            box-shadow: var(--neu-btn);
        }

        .neu-btn-primary:active {
            box-shadow: var(--neu-btn-active) !important;
            transform: scale(0.99);
        }

        .neu-btn-social {
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 14px;
            background: var(--bg-color);
            box-shadow: var(--neu-btn);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        .neu-btn-social:active, .neu-btn-social:focus {
            box-shadow: var(--neu-btn-active) !important;
            background: var(--bg-color);
        }

        /* Neumorphic Divider Custom Layer */
        .divider-line {
            flex: 1;
            height: 3px;
            background: var(--bg-color);
            box-shadow: inset 1px 1px 2px #b0bbc7, inset -1px -1px 2px #ffffff;
            border-radius: 2px;
        }

        /* Functional Loader Transitions */
        .btn-loader { display: none; }
        .neu-button.loading .btn-text { display: none; }
        .neu-button.loading .btn-loader { display: inline-block; }

        /* Screen-overlay Dynamic Success Panel */
        .success-message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .success-message.show {
            transform: translateY(0);
        }

        .success-icon {
            color: var(--success-color);
            box-shadow: inset 4px 4px 8px #c2ccd6, inset -4px -4px 8px #ffffff;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center p-3">

    <div class="card login-card p-4 p-sm-5">
        <!-- Header -->
        <div class="text-center mb-4">
            <div class="neu-icon d-flex justify-content-center align-items-center mx-auto mb-3">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                </svg>
            </div>
            <h2 class="h4 fw-bold mb-1">Create Account</h2>
            <p class="text-muted small">Sign up to get started</p>
        </div>
        
        <!-- Form Content -->
        <form id="signUpForm" novalidate>
            <!-- Name Input Group -->
            <div class="mb-3">
                <div class="neu-input-wrapper">
                    <div class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                    <input type="text" id="fullname" required placeholder=" ">
                    <label for="fullname">Full Name</label>
                </div>
                <div class="text-danger small mt-1 ps-2" id="nameError"></div>
            </div>

            <!-- Email Input Group -->
            <div class="mb-3">
                <div class="neu-input-wrapper">
                    <div class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>
                    <input type="email" id="email" required placeholder=" ">
                    <label for="email">Email address</label>
                </div>
                <div class="text-danger small mt-1 ps-2" id="emailError"></div>
            </div>

            <!-- Password Input Group -->
            <div class="mb-3">
                <div class="neu-input-wrapper">
                    <div class="input-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0110 0v4"></path>
                        </svg>
                    </div>
                    <input type="password" id="password" required placeholder=" ">
                    <label for="password">Password</label>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Toggle password visibility">
                        <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <div class="text-danger small mt-1 ps-2" id="passwordError"></div>
            </div>

            <!-- Terms and Conditions Checkbox Row -->
            <div class="d-flex justify-content-between align-items-center mb-4 small">
                <div class="remember-wrapper">
                    <input type="checkbox" id="terms">
                    <label for="terms" class="text-muted cursor-pointer user-select-none">
                        <div class="neu-checkbox me-1">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        I agree to the Terms & Conditions
                    </label>
                </div>
            </div>

            <!-- Submit Action -->
            <button type="submit" class="btn neu-btn-primary neu-button w-100 mb-4">
                <span class="btn-text">Sign Up</span>
                <span class="btn-loader">
                    <span class="spinner-border spinner-border-sm text-secondary" role="status"></span>
                </span>
            </button>
        </form>

        <!-- Bootstrap Flex Row Divider Grid -->
        <div class="d-flex align-items-center justify-content-center mb-4 text-muted small">
            <div class="divider-line"></div>
            <span class="mx-3">or register with</span>
            <div class="divider-line"></div>
        </div>

        <!-- Social Networks Section -->
        <div class="d-flex justify-content-center gap-3 mb-4">
            <button type="button" class="btn neu-btn-social">
                <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"></path>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"></path>
                </svg>
            </button>
            <button type="button" class="btn neu-btn-social">
                <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"></path>
                </svg>
            </button>
        </div>

        <!-- Footer Signup Reference -->
        <div class="text-center small text-muted">
            Already have an account? <a href="#" class="text-decoration-none text-secondary fw-bold">Sign In</a>
        </div>

        <!-- Animated Success Slide-Up Cover Overlay Layer -->
        <div class="success-message" id="successMessage">
            <div class="neu-icon success-icon d-flex justify-content-center align-items-center mb-3">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <h3 class="h4 fw-bold mb-1">Account Created!</h3>
            <p class="text-muted small text-center">Setting up your profile workspace...</p>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Interactive Form Javascript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const signUpForm = document.getElementById('signUpForm');
            const fullnameInput = document.getElementById('fullname');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            const successMessage = document.getElementById('successMessage');
            
            const nameError = document.getElementById('nameError');
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');

            // 1. Password Visibility Switcher
            passwordToggle.addEventListener('click', () => {
                passwordToggle.classList.toggle('show-pass');
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            });

            // Email Regex Pattern Helper
            const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

            // 2. Submission Interactivity Flow
            signUpForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                let isValid = true;
                nameError.textContent = '';
                emailError.textContent = '';
                passwordError.textContent = '';

                // Input Field Validation Rules
                if (!fullnameInput.value.trim()) {
                    nameError.textContent = 'Full name is required.';
                    isValid = false;
                }

                if (!emailInput.value.trim()) {
                    emailError.textContent = 'Email address is required.';
                    isValid = false;
                } else if (!validateEmail(emailInput.value.trim())) {
                    emailError.textContent = 'Please enter a valid email address.';
                    isValid = false;
                }

                if (!passwordInput.value.trim()) {
                    passwordError.textContent = 'Password is required.';
                    isValid = false;
                } else if (passwordInput.value.length < 6) {
                    passwordError.textContent = 'Password must be at least 6 characters.';
                    isValid = false;
                }

                if (!isValid) return;

                // Enter interactive processing layout state
                const submitBtn = signUpForm.querySelector('.neu-button');
                submitBtn.classList.add('loading');
                submitBtn.disabled = true;

                // Emulate cloud registration connection processing time
                setTimeout(() => {
                    submitBtn.classList.remove('loading');
                    // Reveal the slide success frame cover 
                    successMessage.classList.add('show');
                }, 2000);
            });

            // Strip functional form validation errors instantly during character typing
            fullnameInput.addEventListener('input', () => { if(fullnameInput.value) nameError.textContent = ''; });
            emailInput.addEventListener('input', () => { if(emailInput.value) emailError.textContent = ''; });
            passwordInput.addEventListener('input', () => { if(passwordInput.value) passwordError.textContent = ''; });
        });
    </script>
</body>
</html>
