<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account | AuraAuth</title>
  <meta name="description" content="Register for AuraAuth. Experience secure, lightning-fast authentication with state-of-the-art encryption.">
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Animated Background Elements -->
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="bg-grid"></div>

  <!-- Notification Container -->
  <div id="notification-container" class="notification-container"></div>

  <div class="registration-container">
    <div class="registration-card">
      <div class="card-header">
        <div class="logo-wrapper">
          <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1>Create Account</h1>
        <p class="subtitle">Join our secure cloud portal in just a few steps</p>
      </div>

      <form id="registration-form" class="registration-form" novalidate>
        <!-- Name Input Group -->
        <div class="input-group">
          <div class="input-wrapper">
            <input type="text" id="name" name="name" required placeholder=" " autocomplete="name">
            <label for="name">Full Name</label>
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
          </div>
          <span class="error-msg" id="name-error"></span>
        </div>

        <!-- Email Input Group -->
        <div class="input-group">
          <div class="input-wrapper">
            <input type="email" id="email" name="email" required placeholder=" " autocomplete="email">
            <label for="email">Email Address</label>
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
          </div>
          <span class="error-msg" id="email-error"></span>
        </div>

        <!-- Password Input Group -->
        <div class="input-group">
          <div class="input-wrapper">
            <input type="password" id="password" name="password" required placeholder=" " autocomplete="new-password">
            <label for="password">Password</label>
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Toggle password visibility">
              <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-closed hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <span class="error-msg" id="password-error"></span>

          <!-- Password Strength Section -->
          <div class="password-strength-container">
            <div class="strength-bar-wrapper">
              <div class="strength-bar" id="strength-bar"></div>
            </div>
            <span class="strength-label" id="strength-label">Password Strength: None</span>
          </div>

          <!-- Password Guidelines Checklist -->
          <div class="password-checklist">
            <div class="checklist-item" id="chk-length">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>At least 6 characters</span>
            </div>
            <div class="checklist-item" id="chk-case">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>Uppercase & lowercase letters</span>
            </div>
            <div class="checklist-item" id="chk-number">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>At least one number</span>
            </div>
            <div class="checklist-item" id="chk-symbol">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              <span>At least one symbol</span>
            </div>
          </div>
        </div>

        <!-- Confirm Password Input Group -->
        <div class="input-group">
          <div class="input-wrapper">
            <input type="password" id="confirm-password" name="confirm-password" required placeholder=" ">
            <label for="confirm-password">Confirm Password</label>
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              </svg>
            </span>
          </div>
          <span class="error-msg" id="confirm-error"></span>
        </div>

        <!-- Terms and Conditions Group -->
        <div class="checkbox-group">
          <label class="checkbox-container">
            <input type="checkbox" id="terms" name="terms" required>
            <span class="checkmark">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </span>
            <span class="checkbox-text">I agree to the <a href="#" class="accent-link">Terms of Service</a> and <a href="#" class="accent-link">Privacy Policy</a></span>
          </label>
          <span class="error-msg" id="terms-error"></span>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="submit-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner hidden"></span>
        </button>
      </form>

      <div class="card-footer">
        <p>Already have an account? <a href="#" class="accent-link">Sign In</a></p>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
