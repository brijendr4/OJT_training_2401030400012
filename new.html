<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fashion and Freedom</title>

    <style>
        body {
            margin: 0;
            background-color: #fdfffe;
            color: #222;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        a {
            text-decoration: none;
            color: black;
        }

        .topbar {
            background-color: #000;
            color: #fff;
            padding: 0px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .toplinks {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .toplinks a {
            color: #fff;
            transition: 0.3s;
        }
 
        .toplinks a:hover {
            text-decoration: underline;
        }

        .container1 a {
            transition: 0.2s;
        }
    
        .container1 a:hover {
            text-decoration: underline;
        }
        select {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            outline: none;
        }

        #navbar {
            padding: 22px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
        }

        .container1 {
            display: flex;
            align-items: center;
            gap: 35px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            overflow: hidden;
        }

        .slider {
            display: flex;
            width: 300%;
            transition: 0.5s;
        }

        .slide {
            width: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 550px;
            object-fit: cover;
        }

        #btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 30px;
            border: 1px solid rgb(0, 0, 0);
            color: rgb(0, 0, 0);
            background: transparent;
            font-size: 18px;
            cursor: pointer;
        }
       

        .prev,
        .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.5);
            color: white;
            border: none;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 22px;
        }

        .prev {
            left: 10px;
        }

        .next {
            right: 10px;
        }

        .dot-container {
            text-align: center;
            margin-top: 15px;
        }

        .dot {
            height: 12px;
            width: 12px;
            background-color: gray;
            border-radius: 50%;
            display: inline-block;
            margin: 5px;
            cursor: pointer;
        }

        .active {
            background-color: black;
        }
    </style>
</head>

<body>

    <header class="topbar">
        <h4>Free shipping. 30-day return or refund guarantee</h4>

        <div class="toplinks">
            <a href="#">SIGN IN</a>
            <a href="#">FAQ</a>

            <select name="currency">
                <option>USD</option>
                <option>INR</option>
                <option>EURO</option>
            </select>
        </div>
    </header>

    <nav id="navbar">

        <div id="logo">
            <a href="#">Fashion and Freedom</a>
        </div>

        <div class="container1">
            <a href="#">New</a>
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Accessories</a>
            <a href="#">Jewelry</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>

        <div class="container1">
            <a href="#">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.867-3.834zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
            </a>
            <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-person" viewBox="0 0 16 16">
                    <path
                        d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z" />
                </svg>
            </a>
            <a href="#"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                    class="bi bi-cart" viewBox="0 0 16 16">
                    <path
                        d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5M3.102 4l1.313 7h8.17l1.313-7zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4m7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4m-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2m7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2" />
                </svg>
            </a>
        </div>

    </nav>

    <section class="slider-container">

        <div class="slider" id="slider">

            <div class="slide">
                <h1>The New Way To Display Product by Fashion and Freedom</h1>
                <img src="https://img.magnific.com/free-photo/retro-man-dressed-shirt-lies-floor-posing_171337-9906.jpg?t=st=1778561432~exp=1778565032~hmac=746bd85533147c325dc3c8e4f3c364cf11837c0bb937a14baef80ad1ec4e9d4f&w=1060"
                    alt="">
                <div id="btn">Explore</div>
            </div>

            <div class="slide">
                <img src="https://img.magnific.com/free-photo/smiling-young-lady-listening-music-through-earphones-designed-t-shirt-good-mood-with-long-hair-white_140725-14649.jpg?t=st=1778564799~exp=1778568399~hmac=496088e4034322e952b8cd0980a61bc3cae3b5f75053562c277c7efa994309e0&w=1060"
                    alt="">
            </div>

            <div class="slide">
                <img src="https://img.magnific.com/premium-photo/cool-preteen-boy-child-casual-sportswear-trendy-sunglasses-feeling-happy-showing-vsign-gesture-sitting-studio-wall-background-looking-camera-stylish-positive-handsome-male-kid_417694-437.jpg?w=1060"
                    alt="">
            </div>

        </div>

        <button class="prev" onclick="prevSlide()">❮</button>
        <button class="next" onclick="nextSlide()">❯</button>

        <div class="dot-container">
            <span class="dot active" onclick="showSlide(0)"></span>
            <span class="dot" onclick="showSlide(1)"></span>
            <span class="dot" onclick="showSlide(2)"></span>
        </div>

    </section>

    <script>

        let slideIndex = 0;
        const slider = document.getElementById("slider");
        const dots = document.querySelectorAll(".dot");

        function showSlide(index) {

            slideIndex = index;

            slider.style.transform = `translateX(-${slideIndex * 100 / 3}%)`;

            dots.forEach(dot => dot.classList.remove("active"));

            dots[slideIndex].classList.add("active");
        }

        function nextSlide() {

            slideIndex++;

            if (slideIndex > 2) {
                slideIndex = 0;
            }

            showSlide(slideIndex);
        }

        function prevSlide() {

            slideIndex--;

            if (slideIndex < 0) {
                slideIndex = 2;
            }

            showSlide(slideIndex);
        }

        setInterval(nextSlide, 3000);

    </script>

</body>

</html>
