<!doctype html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My account</title>
    <link rel="stylesheet" href="profile.css" />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&">
    
  </head>

  <body>
    <section class="myacc">
      <div class="wrapt">
        <p>My Account</p>
      </div>
      <div class="con">
        <div class="con1">
          <div class="wrap_p">
            <p style="font-size: 25px; margin-top: 22px;">Welcome user</p>
          </div>
          <div class="wrap_all">
              <div class="wrap_s">
                <div class="icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="25"
                    height="25"
                    fill="currentColor"
                    class="bi bi-box-seam"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="M8.186 1.113a.5.5 0 0 0-.372 0L1.846 3.5l2.404.961L10.404 2zm3.564 1.426L5.596 5 8 5.961 14.154 3.5zm3.25 1.7-6.5 2.6v7.922l6.5-2.6V4.24zM7.5 14.762V6.838L1 4.239v7.923zM7.443.184a1.5 1.5 0 0 1 1.114 0l7.129 2.852A.5.5 0 0 1 16 3.5v8.662a1 1 0 0 1-.629.928l-7.185 2.874a.5.5 0 0 1-.372 0L.63 13.09a1 1 0 0 1-.63-.928V3.5a.5.5 0 0 1 .314-.464z"
                    />
                  </svg>
                </div>
                <div class="h">
                  <p class="p">Order</p>
                </div>
                <div class="next">
                  <span class="material-symbols-outlined"> arrow_forward_ios </span>
                </div>
              </div>
              <div class="wrap_s">
                <div class="icon">
                  <span class="material-symbols-outlined"> favorite </span>
                </div>
                <div class="h"><p class="p">Favorites</p></div>
                <div class="next">
                  <span class="material-symbols-outlined"> arrow_forward_ios </span>
                </div>
              </div>
              <div class="wrap_s">
                <div class="icon">
                  <span class="material-symbols-outlined"> person </span>
                </div>
                <div class="h"><p class="p">Personal Data</p></div>
                <div class="next">
                  <span class="material-symbols-outlined"> arrow_forward_ios </span>
                </div>
              </div>
              <div class="wrap_s">
                <div class="icon">
                  <span class="material-symbols-outlined"> lock </span>
                </div>
                <div class="h"><p class="p">Change Password</p></div>
                <div class="next">
                  <span class="material-symbols-outlined"> arrow_forward_ios </span>
                </div>
              </div>
              <div class="wrap_s">
                <div class="icon">
                  <span class="material-symbols-outlined"> home </span>
                </div>
                <div class="h"><p class="p">Addresses</p></div>
                <div class="next">
                  <span class="material-symbols-outlined"> arrow_forward_ios </span>
                </div>
              </div>
              <div class="wrap_s">
                <div class="icon">
                  <span class="material-symbols-outlined"> logout </span>
                </div>
                <div class="h"><p class="p">Sign Up</p></div>
                <div class="next">
                  <span class="material-symbols-outlined"> arrow_forward_ios </span>
                </div>
              </div>
          </div>
        </div>
        <div class="con2">
          <form class="row g-3">
  <div class="col-md-6">
    <label for="inputEmail4" class="form-label">Email</label>
    <input type="email" class="form-control" id="inputEmail4">
  </div>
  <div class="col-md-6">
    <label for="inputPassword4" class="form-label">Password</label>
    <input type="password" class="form-control" id="inputPassword4">
  </div>
  <div class="col-12">
    <label for="inputAddress" class="form-label">Address</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
  </div>
  <div class="col-12">
    <label for="inputAddress2" class="form-label">Address 2</label>
    <input type="text" class="form-control" id="inputAddress2" placeholder="Apartment, studio, or floor">
  </div>
  <div class="col-md-6">
    <label for="inputCity" class="form-label">City</label>
    <input type="text" class="form-control" id="inputCity">
  </div>
  <div class="col-md-4">
    <label for="inputState" class="form-label">State</label>
    <select id="inputState" class="form-select">
      <option selected>Choose...</option>
      <option>...</option>
    </select>
  </div>
  <div class="col-md-2">
    <label for="inputZip" class="form-label">Zip</label>
    <input type="text" class="form-control" id="inputZip">
  </div>
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
        Check me out
      </label>
    </div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Submit</button>
  </div>
</form>     
      </div>
    </section>
  </body>
</html>
