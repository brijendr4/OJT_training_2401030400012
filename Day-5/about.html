<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Products</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #111;
      }

      .container {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      .container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: brightness(60%);
      }

      .content {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: white;
      }

      .content h1 {
        font-size: 65px;
        margin-bottom: 20px;
        letter-spacing: 2px;

        /* Animation */
        opacity: 0;
        animation: slideDown 1.2s ease forwards;
      }

      .content p {
        font-size: 20px;
        margin-bottom: 30px;

        opacity: 0;
        animation: slideDown 1.5s ease forwards;
      }

      .btn {
        padding: 14px 35px;
        font-size: 18px;
        border: none;
        border-radius: 30px;
        background: white;
        color: black;
        cursor: pointer;
        transition: 0.4s;

        opacity: 0;
        animation: slideUp 1.8s ease forwards;
      }

      .btn:hover {
        background: #ff9800;
        color: white;
        transform: scale(1.08);
      }

      @keyframes slideDown {
        from {
          transform: translateY(-80px);
          opacity: 0;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      @keyframes slideUp {
        from {
          transform: translateY(80px);
          opacity: 0;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* Responsive */
      @media (max-width: 768px) {
        .content h1 {
          font-size: 40px;
        }

        .content p {
          font-size: 16px;
        }

        .btn {
          padding: 12px 25px;
          font-size: 16px;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img
        src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=1200&auto=format&fit=crop"
        alt="Products Image"
      />

      <div class="content">
        <h1>About Products</h1>

        <p>
          Discover premium quality products with modern style and innovation.
        </p>

        <button class="btn">Explore</button>
      </div>
    </div>
  </body>
</html>
