<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&"
    />
    <link rel="stylesheet" href="contact.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <p id="f">Contact Us</p>
        <div class="p">
          <p id="s">Home</p>
          <p>/ cart</p>
        </div>
      </div>
    </header>
    <div class="container2">
      <div class="box1">
        <div class="wrap">
          <div class="wrap2">
            <input type="text" placeholder="Your Name" />
            <input type="email" placeholder="Your Email" /><br />
          </div>
          <br />
          <input class="text" type="text" placeholder="Subject" /><br /><br />
          <textarea class="textarea" id=""></textarea> <br /><br />
          <button>SEND MESSAGE</button>
        </div>
      </div>
      <div class="box2">
        <div class="wrapp">
          <div class="loc">
            <div class="loc_icon">
              <span class="material-symbols-outlined"> location_on </span>
            </div>
            <div class="loc_wrap">
              <p style="font-size: 20px">Location :</p>
              <p>Ahemdabad , Gujrat 382405</p>
            </div>
          </div>
          <div class="oh">
            <div class="oh_icon">
              <span class="material-symbols-outlined">
                nest_clock_farsight_analog
              </span>
            </div>
            <div class="oh_wrap">
              <p>Open Hours</p>
              <p>Sunday-Friday</p>
              <p>11:00 AM to 23:00 PM</p>
            </div>
          </div>
          <div class="em">
            <div class="em_icon">
              <span class="material-symbols-outlined"> mail </span>
            </div>
            <div class="em_wrap">
              <p>Email</p>
              <p>info@fashionandfreedom</p>
            </div>
          </div>
          <div class="cl">
            <div class="cl_icon">
              <span class="material-symbols-outlined"> call </span>
            </div>
            <div class="cl_wrap">
              <p>Call</p>
              <p>+ 123456789</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
