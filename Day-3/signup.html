<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <style>
        #card {
            background-color: rgb(116, 116, 116);
            padding: 100px;
            margin: 100px 200px 10px 200px;
            text-align: center;
            border-radius: 20px;
            display: flex;
            gap: 10px;
            color: white;

        }

        .container1 {
            padding: 8px;
            width: 40%;
            border: 1px solid white;
            border-radius: 15px;
            flex: 1;
            font-size: 20px;
            height: 70vh;
        }

        .container>p {
            font-size: 10px;
        }

        div {
            font-size: 25px;
        }

        .container2 {
            padding: 8px;
            width: 40%;
            border: 1px solid white;
            border-radius: 15px;
            flex: 1;
        }

        .btn1 {
            width: 80%;
            height: 30px;
            margin-top: 10px;
            border: 2px solid white;
            border-radius: 12px;
            text-align: center;
            background: transparent;
            color: white;

        }

        .btn2 {
            width: 80%;
            height: 30px;
            margin-top: 10px;
            border: 2px solid white;
            border-radius: 12px;
            text-align: center;
            background: white ;
            color: black

        }

        input {
            width: 80%;
            height: 30px;
            margin-top: 10px;
            background: transparent;
            border-radius: 12px;
            border: 2px solid white;
        }

        ::placeholder {
            color: white;
            font-size: 16px;
            text-align: center;
        }

    </style>
</head>

<body>

    <form id="card">

        <div class="container1">

            <h1>Fashion and Freedom</h1>

            <p>
                Create your account and explore the latest fashion trends,
                accessories, and exclusive collections with us.
            </p>

            <button class="btn1" type="button">
                Explore Collection
            </button>

        </div>

        <div class="container2">

            <h2>Create Account</h2>

            <input type="text" placeholder="Full Name">

            <input type="email" placeholder="Email Address">

            <input type="text" placeholder="Username">

            <input type="password" placeholder="Password">

            <input type="password" placeholder="Confirm Password">

            <button class="btn2">
                Sign Up
            </button>

            <div class="login-link">
                Already have an account?
                <a href="#">Sign In</a>
            </div>

        </div>

    </form>

</body>

</html>
