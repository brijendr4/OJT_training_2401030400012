<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login </title>

    <style>
        #card {
            background-color: rgb(212, 214, 211);
            padding: 100px;
            margin: 100px 200px 10px 200px;
            text-align: center;
            border-radius: 20px;
            display: flex;
            gap: 10px;
        }

        .container1 {
            padding: 60px;
            width: 40%;
            border: 1px solid white;
            border-radius: 15px;
            flex: 1;
            font-size: 25px;
        }

        .container> p {
            font-size: 10px;
        }
        div {
            font-size: 25px;
        }

        .container2 {
            padding: 60px;
            width: 40%;
            border: 1px solid white;
            border-radius: 15px;
            flex: 1;
            
        }

        .box {
            width: 80%;
            height: 30px;
            margin-top: 10px;
            border: 2px solid white;
            border-radius: 12px;
            text-align: center;
            

        }

        input {
            width: 80%;
            height: 30px;
            margin-top: 10px;
            background: transparent;
            border-radius: 12px;
            border: 2px solid white;
        }

        #card>h1 {
            position: absolute;
            width: 60%;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 12px 30px;
            color: rgb(255, 255, 255);
            background: transparent;
            font-size: 50px;
            cursor: pointer;
            text-align: center;
        }
         ::placeholder {
            color: white;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

    <form id="card">
        <h1> Fashion and Freedom </h1>
        <div class="container1">

            <h3>Welcome Back</h3>
            <p>
                Lorem ipsum dolor sit amet consectetur .
            </p>

            <div class="box">Sign in</div>
            <div class="box">Sign up</div>
        </div>
        <div class="container2">
            <input type="text" placeholder="Username">
            <input type="password" placeholder="Password">
            <div class="box"> Sign in</div>
            <p> Forget password ?</p>
        </div>

    </form>

</body>

</html>
